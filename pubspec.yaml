name: massar
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  ar_flutter_plugin_2:
    path: packages/ar_flutter_plugin_2
  # Backs NetImage. Flutter's own Image.network cache is memory-only, so every
  # cold start re-downloaded every catalogue photo over what is often a mobile
  # connection. This one persists to disk, and lets a thumbnail be cached under
  # a stable key even when the URL that fetched it was a rotating signed one.
  cached_network_image: ^3.4.1
  # The plain capture screen's viewfinder. The AR plugin cannot serve it:
  # ARCore/ARKit hold the camera exclusively and expose only `snapshot()`, a
  # single still over a method channel, so there is no way to record video
  # through it. The hunt keeps the AR stack; only the plain camera swaps.
  camera: ^0.11.0
  crypto: ^3.0.3
  equatable: ^2.1.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter:
    sdk: flutter
  flutter_3d_controller: ^2.0.0
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.2
  flutter_compass: ^0.8.1
  flutter_dotenv: ^5.2.0
  flutter_image_compress: ^2.3.0
  flutter_local_notifications: ^18.0.1
  # Ships the Material/Cupertino/Widgets translations (date pickers, the
  # "Back" tooltip, text-selection menus) and, for Arabic, the directionality
  # that makes the whole tree lay itself out right-to-left. Without it the app
  # would be translated but still mirrored the wrong way round.
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  google_fonts: ^8.2.0
  google_mlkit_image_labeling: ^0.15.0
  http: ^1.2.0
  image_picker: ^1.2.3
  # Already present transitively; named explicitly because the sources gen-l10n
  # writes import it directly, and generated code should not rest on a pin that
  # something else happens to be dragging in.
  intl: ^0.20.2
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  permission_handler: ^11.4.0
  provider: ^6.1.5+1
  shared_preferences: ^2.3.4
  supabase_flutter: ^2.8.4
  table_calendar: ^3.2.0
  vector_math: ^2.2.0
  # Replays a just-recorded clip so it can be kept or discarded, the way a
  # photo is. Without playback the only honest option was to file every clip
  # unseen — you cannot judge a video from a still of its first frame.
  video_player: ^2.9.2

# ar_flutter_plugin_2 pins geolocator ^12 (it only uses it for cloud anchors,
# which this app doesn't). Overriding keeps the rest of the app on the current
# geolocator rather than dragging it two majors back.
dependency_overrides:
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  # Runs gen-l10n on every build, turning lib/l10n/*.arb into the AppLocalizations
  # the app imports. Configured by l10n.yaml.
  generate: true

  assets:
    - assets/3d/fennec.glb
    - assets/3d/rigged_animated_fennec.glb
    # Shown by NetImage when a location has no real photo, in place of the
    # random stock image the old picsum.photos fallback pulled in.
    - assets/icon/app-icon-transparent.png
    - assets/dz_wilayas.geojson
    # Registered as a directory, not file by file: the intro's illustrations
    # don't exist yet, and this way dropping them in needs no pubspec change.
    # Until then each slide falls back to a labelled placeholder.
    - assets/onboarding/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # The App Store rejects icons with an alpha channel; the artwork is fully
  # opaque anyway, so flattening it costs nothing.
  remove_alpha_ios: true
  # iOS has no inset concept — the whole square is the icon — so the margin has
  # to be baked into the source. This is the master artwork: the fennec on the
  # flat navy field, which matches adaptive_icon_background and
  # splash_background exactly. Everything else is derived from it.
  image_path: "assets/icon/app-icon-ios.png"
  # Android 8+ renders the adaptive icon in preference to the raster
  # launcher_icon.png, so this has to be regenerated too or the old artwork
  # sticks around. The foreground is the same artwork with the navy field keyed
  # out — transparent is what an adaptive foreground should be, since the navy
  # comes from the background layer, so mask shape and parallax behave.
  adaptive_icon_background: "#19274C"
  adaptive_icon_foreground: "assets/icon/app-icon-transparent.png"
  # Both masters are centred on the fennec's *body circle*, not on its bounding
  # box (see tool/center_icon_artwork.py), so the ear overhangs up and to the
  # left and the farthest pixel sits 1122 of the master's 1024px half-canvas
  # from centre. A 23% inset draws the canvas at 108*(1-0.46) = 58.3dp, which
  # puts that ear tip 31.9dp from centre — inside the 33dp radius of the 66dp
  # safe zone, so no mask shape clips it. The body circle lands at ~47dp.
  adaptive_icon_foreground_inset: 23
  min_sdk_android: 21
