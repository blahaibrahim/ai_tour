name: ai_tour
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  ar_flutter_plugin_2: ^0.0.3
  crypto: ^3.0.3
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_3d_controller: ^2.0.0
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^5.2.0
  flutter_image_compress: ^2.3.0
  flutter_map: ^8.3.1
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  google_fonts: ^8.2.0
  google_mlkit_image_labeling: ^0.15.0
  http: ^1.2.0
  image_picker: ^1.2.3
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  permission_handler: ^11.4.0
  provider: ^6.1.5+1
  supabase_flutter: ^2.8.4
  table_calendar: ^3.2.0
  vector_math: ^2.2.0

# ar_flutter_plugin_2 pins geolocator ^12 (it only uses it for cloud anchors,
# which this app doesn't). Overriding keeps the rest of the app on the current
# geolocator rather than dragging it two majors back.
dependency_overrides:
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  assets:
    - assets/3d/fennec.glb
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # The App Store rejects icons with an alpha channel; the artwork is fully
  # opaque anyway, so flattening it costs nothing.
  remove_alpha_ios: true
  image_path: "assets/icon/app-icon-blue.png"
  adaptive_icon_background: "#14254A"
  adaptive_icon_foreground: "assets/icon/app-icon-transparent.png"
  min_sdk_android: 21
