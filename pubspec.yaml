name: ai_tour
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  ar_flutter_plugin_2: ^0.0.3
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  geolocator: ^14.0.3
  google_fonts: ^8.2.0
  image_picker: ^1.2.3
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  permission_handler: ^11.4.0
  provider: ^6.1.5+1
  table_calendar: ^3.2.0
  vector_math: ^2.2.0

# ar_flutter_plugin_2 pins geolocator ^12 (it only uses it for cloud anchors,
# which this app doesn't). Overriding keeps the rest of the app on the current
# geolocator rather than dragging it two majors back.
dependency_overrides:
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/3d/fennec.glb
